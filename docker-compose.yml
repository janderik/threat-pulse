version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatpulse
      POSTGRES_PASSWORD: threatpulse_secret
      POSTGRES_DB: threatpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://threatpulse:threatpulse_secret@db:5432/threatpulse
      COLLECTOR_INTERVAL_MINUTES: "15"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./examples:/app/examples

volumes:
  pgdata:
